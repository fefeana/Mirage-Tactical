name: mirage_tactical
description: "ميراج التكتيكي - VPN سريع وآمن، يعمل على أندرويد والويب"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # النواة والاتصالات (يعمل على جميع المنصات)
  grpc: ^3.2.0
  protobuf: ^3.0.0
  http: ^1.2.0
  
  # التخزين (يعمل على جميع المنصات)
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0  # لأندرويد
  flutter_secure_storage_web: ^1.1.2  # للويب
  
  # الشبكات (يعمل على جميع المنصات)
  connectivity_plus: ^6.0.3
  web_socket_channel: ^2.4.0
  
  # الواجهة والتفاعل
  provider: ^6.1.1
  go_router: ^14.2.0
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  
  # Firebase (يعمل على جميع المنصات)
  firebase_core: ^3.5.0
  firebase_analytics: ^11.3.3
  firebase_remote_config: ^5.3.3
  
  # تدويل
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # أدوات مساعدة للمنصات
  universal_platform: ^1.0.0+1  # للكشف عن المنصة

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/animations/
    - assets/configs/servers_hub.json
    - assets/configs/stealth_rules.json
