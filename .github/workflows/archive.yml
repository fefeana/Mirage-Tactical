name: 📦 النقل إلى الأرشيف

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: ⚙️ إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📥 تحميل السكربت
        run: |
          curl -o archive_mover.py https://raw.githubusercontent.com/fefeana/Mirage-Tactical/main/archive_mover.py
      
      - name: 📦 تشغيل النقل إلى الأرشيف
        run: echo "2" | python3 archive_mover.py
      
      - name: 📤 رفع التقرير
        uses: actions/upload-artifact@v4
        with:
          name: archive-report
          path: archive_report.json
      
      - name: 📤 دفع التغييرات
        run: |
          git config --global user.name "Mirage Archiver"
          git config --global user.email "archiver@mirage.ai"
          git add .
          git diff --staged --quiet || git commit -m "📦 نقل الملفات القديمة إلى الأرشيف [skip ci]"
          git push
