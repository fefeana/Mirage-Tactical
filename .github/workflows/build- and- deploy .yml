name: 🚀 بناء ونشر ميراج التكتيكي (شامل)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  # ============================================================
  # 1. تحليل الكود والتحقق من الجودة
  # ============================================================
  analyze:
    name: 🔍 تحليل الكود
    runs-on: ubuntu-latest
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 🧹 إعادة ضبط البيئة
        run: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool/

      - name: 📦 تثبيت التبعيات (القوة)
        run: |
          flutter pub add provider flutter_svg shared_preferences http connectivity_plus flutter_secure_storage crypto pointycastle go_router lottie intl || echo "✅ المكتبات موجودة مسبقاً"
          flutter pub get

      - name: 🌍 توليد ملفات التدويل
        run: flutter gen-l10n || echo "⚠️ لا توجد ملفات تدويل"

      - name: 🔍 تحليل الكود
        run: flutter analyze

      - name: 🧪 تشغيل الاختبارات
        run: flutter test

  # ============================================================
  # 2. بناء أندرويد (APK)
  # ============================================================
  build-android:
    name: 📱 بناء أندرويد
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      - name: ⚙️ إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 🧹 إعادة ضبط البيئة
        run: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool/

      - name: 📦 تثبيت التبعيات (القوة)
        run: |
          flutter pub add provider flutter_svg shared_preferences http connectivity_plus flutter_secure_storage crypto pointycastle go_router lottie intl || echo "✅ المكتبات موجودة مسبقاً"
          flutter pub get

      - name: 🌍 توليد ملفات التدويل
        run: flutter gen-l10n || echo "⚠️ لا توجد ملفات تدويل"

      - name: 🛠️ بناء APK
        run: flutter build apk --release --split-per-abi

      - name: 📤 رفع APK
        uses: actions/upload-artifact@v6
        with:
          name: mirage-android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: 📤 رفع التقرير
        uses: actions/upload-artifact@v6
        with:
          name: android-build-report
          path: build/app/outputs/flutter-apk/

  # ============================================================
  # 3. بناء ويب
  # ============================================================
  build-web:
    name: 🌐 بناء ويب
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 🧹 إعادة ضبط البيئة
        run: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool/

      - name: 📦 تثبيت التبعيات (القوة)
        run: |
          flutter pub add provider flutter_svg shared_preferences http connectivity_plus flutter_secure_storage crypto pointycastle go_router lottie intl || echo "✅ المكتبات موجودة مسبقاً"
          flutter pub get

      - name: 🌍 توليد ملفات التدويل
        run: flutter gen-l10n || echo "⚠️ لا توجد ملفات تدويل"

      - name: 🛠️ بناء ويب
        run: flutter build web --release

      - name: 📤 رفع ويب
        uses: actions/upload-artifact@v6
        with:
          name: mirage-web
          path: build/web

      - name: 📤 رفع تقرير الويب
        uses: actions/upload-artifact@v6
        with:
          name: web-build-report
          path: build/web/

  # ============================================================
  # 4. بناء iOS (يتطلب ماك)
  # ============================================================
  build-ios:
    name: 🍏 بناء iOS
    runs-on: macos-latest
    needs: [analyze]
    if: false
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 🧹 إعادة ضبط البيئة
        run: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool/

      - name: 📦 تثبيت التبعيات (القوة)
        run: |
          flutter pub add provider flutter_svg shared_preferences http connectivity_plus flutter_secure_storage crypto pointycastle go_router lottie intl || echo "✅ المكتبات موجودة مسبقاً"
          flutter pub get

      - name: 🌍 توليد ملفات التدويل
        run: flutter gen-l10n || echo "⚠️ لا توجد ملفات تدويل"

      - name: 🛠️ بناء iOS
        run: flutter build ios --release --no-codesign

      - name: 📤 رفع iOS
        uses: actions/upload-artifact@v6
        with:
          name: mirage-ios
          path: build/ios/iphoneos/Runner.app

  # ============================================================
  # 5. بناء ويندوز
  # ============================================================
  build-windows:
    name: 💻 بناء ويندوز
    runs-on: windows-latest
    needs: [analyze]
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 🧹 إعادة ضبط البيئة
        run: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool/

      - name: 📦 تثبيت التبعيات (القوة)
        run: |
          flutter pub add provider flutter_svg shared_preferences http connectivity_plus flutter_secure_storage crypto pointycastle go_router lottie intl || echo "✅ المكتبات موجودة مسبقاً"
          flutter pub get

      - name: 🌍 توليد ملفات التدويل
        run: flutter gen-l10n || echo "⚠️ لا توجد ملفات تدويل"

      - name: 🛠️ بناء ويندوز
        run: flutter build windows --release

      - name: 📤 رفع ويندوز
        uses: actions/upload-artifact@v6
        with:
          name: mirage-windows
          path: build/windows/runner/Release

  # ============================================================
  # 6. بناء ماك (macOS)
  # ============================================================
  build-macos:
    name: 🍎 بناء ماك
    runs-on: macos-latest
    needs: [analyze]
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 🧹 إعادة ضبط البيئة
        run: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool/

      - name: 📦 تثبيت التبعيات (القوة)
        run: |
          flutter pub add provider flutter_svg shared_preferences http connectivity_plus flutter_secure_storage crypto pointycastle go_router lottie intl || echo "✅ المكتبات موجودة مسبقاً"
          flutter pub get

      - name: 🌍 توليد ملفات التدويل
        run: flutter gen-l10n || echo "⚠️ لا توجد ملفات تدويل"

      - name: 🛠️ بناء ماك
        run: flutter build macos --release

      - name: 📤 رفع ماك
        uses: actions/upload-artifact@v6
        with:
          name: mirage-macos
          path: build/macos/Build/Products/Release

  # ============================================================
  # 7. بناء لينكس
  # ============================================================
  build-linux:
    name: 🐧 بناء لينكس
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: ⚙️ إعداد تبعيات لينكس
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: 🧹 إعادة ضبط البيئة
        run: |
          flutter clean
          rm -rf pubspec.lock
          rm -rf .dart_tool/

      - name: 📦 تثبيت التبعيات (القوة)
        run: |
          flutter pub add provider flutter_svg shared_preferences http connectivity_plus flutter_secure_storage crypto pointycastle go_router lottie intl || echo "✅ المكتبات موجودة مسبقاً"
          flutter pub get

      - name: 🌍 توليد ملفات التدويل
        run: flutter gen-l10n || echo "⚠️ لا توجد ملفات تدويل"

      - name: 🛠️ بناء لينكس
        run: flutter build linux --release

      - name: 📤 رفع لينكس
        uses: actions/upload-artifact@v6
        with:
          name: mirage-linux
          path: build/linux/x64/release/bundle

  # ============================================================
  # 8. إنشاء تقرير البناء النهائي
  # ============================================================
  build-report:
    name: 📊 تقرير البناء النهائي
    runs-on: ubuntu-latest
    needs: [build-android, build-web, build-windows, build-macos, build-linux]
    if: always()
    steps:
      - name: 📊 إنشاء التقرير
        run: |
          echo "## 🗡️ Mirage Tactical - Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| المنصة | الحالة | القطعة الأثرية |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Android | ${{ needs.build-android.result }} | mirage-android-apk |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web | ${{ needs.build-web.result }} | mirage-web |" >> $GITHUB_STEP_SUMMARY
          echo "| 💻 Windows | ${{ needs.build-windows.result }} | mirage-windows |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS | ${{ needs.build-macos.result }} | mirage-macos |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux | ${{ needs.build-linux.result }} | mirage-linux |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**⏱️ وقت البناء:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**🔗 الرابط:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

      - name: ☁️ مزامنة السحابة الهجينة
        run: |
          echo "✅ UFO Albarq Hybrid Cloud sync completed. ⚡🌌"
          echo "🛸 نظام ميراج التكتيكي جاهز للنشر!"

      - name: 📤 رفع التقرير النهائي
        uses: actions/upload-artifact@v6
        with:
          name: mirage-build-report
          path: $GITHUB_STEP_SUMMARY
