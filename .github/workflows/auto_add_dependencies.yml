name: 🤖 إضافة التبعيات تلقائياً (سحابي بالكامل)

on:
  workflow_dispatch:  # تشغيل يدوي من تبويب Actions
  push:
    branches: [ main, master ]

jobs:
  auto-add-dependencies:
    name: 📦 إضافة التبعيات تلقائياً
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ============================================================
      # 1. سحب الكود من المستودع
      # ============================================================
      - name: 📥 سحب الكود
        uses: actions/checkout@v5

      # ============================================================
      # 2. إعداد Flutter
      # ============================================================
      - name: ⚙️ إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # ============================================================
      # 3. عرض محتوى pubspec.yaml قبل التعديل (للمقارنة)
      # ============================================================
      - name: 📄 عرض pubspec.yaml قبل التعديل
        run: cat pubspec.yaml

      # ============================================================
      # 4. إضافة جميع التبعيات دفعة واحدة (الطريقة الحديثة)
      # ============================================================
      - name: 🤖 إضافة التبعيات تلقائياً
        run: |
          flutter pub add provider \
            flutter_svg \
            shared_preferences \
            http \
            connectivity_plus \
            flutter_secure_storage \
            crypto \
            pointycastle \
            go_router \
            lottie \
            intl

      # ============================================================
      # 5. عرض محتوى pubspec.yaml بعد التعديل (للتأكد)
      # ============================================================
      - name: 📄 عرض pubspec.yaml بعد التعديل
        run: cat pubspec.yaml

      # ============================================================
      # 6. دفع التغييرات إلى المستودع (بدون تدخل يدوي)
      # ============================================================
      - name: 📤 دفع التغييرات إلى المستودع
        run: |
          git config --global user.name "Mirage Bot"
          git config --global user.email "bot@mirage.ai"
          git add pubspec.yaml pubspec.lock
          git diff --staged --quiet || git commit -m "🤖 إضافة التبعيات تلقائياً [skip ci]"
          git push
